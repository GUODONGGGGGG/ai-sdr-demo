<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>访问 AI SDR 演示</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6f3;color:#193126;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.card{width:min(100%,420px);padding:35px;background:#fff;border:1px solid #e0e9df;border-radius:18px;box-shadow:0 14px 45px #153b2d12}.mark{display:inline-grid;place-items:center;width:38px;height:38px;background:#d9f3aa;border-radius:10px;font-size:25px}.eyebrow{margin:24px 0 8px;color:#348254;font-size:11px;font-weight:800;letter-spacing:2px}h1{margin:0;font-size:26px}p{color:#6a7c70;line-height:1.7;font-size:13px}label{display:block;margin:25px 0 8px;font-size:12px;font-weight:700}input{width:100%;height:45px;padding:0 12px;border:1px solid #cfded0;border-radius:8px;font:inherit;font-size:15px}input:focus{outline:2px solid #b5e3b6}button{width:100%;height:44px;margin-top:14px;border:0;border-radius:8px;background:#136d4d;color:#fff;font:inherit;font-weight:700;cursor:pointer}.error{margin:12px 0 0;color:#a8442b;font-size:12px}.note{margin-top:24px;padding-top:16px;border-top:1px solid #e8eee7;font-size:11px;color:#8c9a90}
  </style>
</head>
<body>
  <main class="card">
    <span class="mark">✳</span>
    <div class="eyebrow">AI SDR AGENT DEMO</div>
    <h1>欢迎试用</h1>
    <p>请输入随演示链接提供的访问码，体验虚构线索的评分、文字外呼和 AI SQL 判断。</p>
    <form method="post" action="/login">
      <label for="code">演示访问码</label>
      <input id="code" name="code" type="password" required autofocus autocomplete="off">
      <button type="submit">进入演示 ↗</button>
    </form>
    {% if invalid %}<div class="error" role="alert">访问码不正确，请重试。</div>{% endif %}
    {% if rate_limited %}<div class="error" role="alert">尝试次数过多，请稍后再试。</div>{% endif %}
    <div class="note">演示使用虚构企业与客户数据；请勿输入真实客户敏感信息。</div>
  </main>
</body>
</html>
